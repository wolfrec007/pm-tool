{% extends "base.html" %}

{% block title %}Access Denied - splanly{% endblock %}

{% block content %}
<style>
  .error-face {
    width: 110px; height: 110px; margin: 0 auto 22px;
    border-radius: 50%; background: hsl(var(--card));
    border: 3px solid hsl(var(--foreground));
    position: relative;
    box-shadow: 0 14px 30px -14px rgba(0,0,0,.2);
  }
  .error-eye {
    position: absolute; top: 36px;
    width: 11px; height: 11px; border-radius: 50%;
    background: hsl(var(--foreground));
  }
  .error-brow {
    position: absolute; top: 26px;
    width: 18px; height: 3px;
    background: hsl(var(--foreground));
    border-radius: 2px;
  }
  .error-mouth {
    position: absolute; bottom: 28px; left: 50%;
    width: 30px; height: 3px;
    background: hsl(var(--foreground));
    border-radius: 2px;
    transform: translateX(-50%);
  }
  .lock-icon {
    position: absolute; bottom: -8px; right: -8px;
    width: 36px; height: 36px; border-radius: 50%;
    background: hsl(32 95% 55%);
    display: flex; align-items: center; justify-content: center;
    border: 3px solid hsl(var(--card));
  }
</style>

<div class="flex items-center justify-center min-h-[80vh] px-4">
  <div class="text-center" style="max-width: 460px;">
    <div class="error-face">
      <span class="error-brow" style="left:28px; transform:rotate(12deg);"></span>
      <span class="error-brow" style="right:28px; transform:rotate(-12deg);"></span>
      <span class="error-eye" style="left:30px;"></span>
      <span class="error-eye" style="right:30px;"></span>
      <span class="error-mouth"></span>
      <div class="lock-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
    </div>

    <h1 class="text-2xl font-semibold tracking-tight mb-2">Access denied</h1>
    <p class="text-muted-foreground text-sm mb-6" style="line-height:1.65;">
      You don't have permission to view this page. If you think this is a mistake, ask your firm admin to update your role.
    </p>

    <div class="flex gap-3 justify-center">
      <a href="/dashboard" class="uk-btn uk-btn-primary" style="border-radius:999px; height:44px; font-weight:600;">
        Go to Dashboard
      </a>
      <a href="javascript:history.back()" class="uk-btn uk-btn-outline" style="border-radius:999px; height:44px;">
        Go back
      </a>
    </div>
  </div>
</div>
{% endblock %}
