<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Demo - splanly</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2314304d'/><circle cx='38' cy='54' r='22' fill='%234f82b0' fill-opacity='0.85'/><circle cx='62' cy='46' r='22' fill='%23eef5fc'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  (function(){
    try{
      var franken = JSON.parse(localStorage.getItem('__FRANKEN__') || '{}');
      var saved = franken.mode || localStorage.getItem('splanly-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    }catch(e){ document.documentElement.setAttribute('data-theme','light'); }
  })();
</script>
<style>
  :root{
    --navy:#16324f;--heading:#16324f;--steel:#4f82b0;--steel-light:#a9c8e2;
    --bg:#f6fafe;--card:#ffffff;--nav-bg:rgba(246,250,254,.82);
    --ink:#10202f;--muted:#5c7086;--border:#dee9f3;
    --radius-lg:22px;--radius-md:14px;--shadow:0 1px 2px rgba(16,32,47,.04),0 12px 32px -16px rgba(20,48,77,.18);
    --ease:cubic-bezier(.16,.8,.28,1);
  }
  html[data-theme="dark"]{
    --navy:#eaf2fb;--heading:#f2f7fc;--steel:#6fa2cf;--steel-light:#2e567c;
    --bg:#0b1a29;--card:#12283d;--nav-bg:rgba(11,26,41,.82);
    --ink:#e9f1f9;--muted:#93a9bd;--border:#1f3a52;
    --shadow:0 1px 2px rgba(0,0,0,.2),0 16px 36px -16px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;transition:background .25s var(--ease),color .25s var(--ease);}
  h1,h2{font-family:'Plus Jakarta Sans',sans-serif;color:var(--heading);letter-spacing:-0.02em;}
  a{color:inherit;text-decoration:none;}

  header{position:sticky;top:0;z-index:100;background:var(--nav-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);transition:background .25s var(--ease);}
  .nav{display:flex;align-items:center;justify-content:space-between;height:64px;max-width:1280px;margin:0 auto;padding:0 24px;}
  .brand{display:flex;align-items:center;gap:6px;}
  .brand-mark{width:28px;height:28px;border-radius:8px;background:var(--navy);position:relative;overflow:hidden;flex-shrink:0;}
  .brand-mark span{position:absolute;border-radius:50%;}
  .brand-mark .b1{width:18px;height:18px;background:var(--steel);opacity:.88;left:1px;top:8px;}
  .brand-mark .b2{width:15px;height:15px;background:#eef5fc;right:2px;top:3px;}
  html[data-theme="dark"] .brand-mark .b2{background:#0b1a29;}
  .brand-word{font-family:'Plus Jakarta Sans';font-weight:700;font-size:17px;color:var(--heading);}
  .back-link{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--muted);padding:8px 12px;border-radius:8px;transition:color .15s,background .15s;}
  .back-link:hover{color:var(--heading);background:var(--card);}
  .theme-toggle{background:none;border:none;color:var(--heading);cursor:pointer;padding:4px;transition:transform .3s;}
  .theme-toggle:hover{transform:rotate(15deg);}
  .theme-toggle svg{width:20px;height:20px;}
  .theme-toggle .icon-moon{display:none;}
  html[data-theme="dark"] .theme-toggle .icon-sun{display:none;}
  html[data-theme="dark"] .theme-toggle .icon-moon{display:block;}

  .page-wrap{max-width:1200px;margin:0 auto;padding:24px;}
  .page-header{text-align:center;margin-bottom:24px;}
  .page-header h1{font-size:clamp(24px,3vw,32px);font-weight:800;margin-bottom:8px;}
  .page-header p{color:var(--muted);font-size:15px;max-width:500px;margin:0 auto;}
  .cal-frame{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);height:calc(100vh - 200px);min-height:500px;}
  .cal-frame iframe{border:none;width:100%;height:100%;background:#eef5fc;}

  .contact-row{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:16px;font-size:13px;color:var(--muted);}
  .contact-row a{color:var(--steel);font-weight:600;display:flex;align-items:center;gap:6px;}
  .contact-row a:hover{text-decoration:underline;}

  @media(max-width:640px){
    .page-wrap{padding:16px;}
    .cal-frame{height:calc(100vh - 160px);min-height:400px;}
  }
</style>
</head>
<body>

<header>
  <div class="nav">
    <a href="/" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      Back to splanly
    </a>
    <button class="theme-toggle" id="themeToggle" type="button" title="Toggle theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </div>
</header>

<main>
  <div class="page-wrap">
    <div class="page-header">
      <h1>Book a discovery call</h1>
      <p>Pick a time that works for you. We'll walk you through how splanly fits your firm's workflow.</p>
    </div>

    <div class="cal-frame">
      <iframe src="https://calendar.zoho.in/zc/view/slot-booking/zz080212300acc13033d01ac0cdd47751184164ddc793c900fba9f96207145c64ddf5695a014546d2030fdcbb2a669de45cf4f4c5f" title="Book a discovery call" loading="lazy"></iframe>
    </div>

    <div class="contact-row">
      <span>Or reach us directly:</span>
      <a href="tel:+919845145102">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92Z"/></svg>
        +91 98451 45102
      </a>
      <a href="mailto:samarth@skilledca.in">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        samarth@skilledca.in
      </a>
    </div>
  </div>
</main>

<script>
  document.getElementById('themeToggle').addEventListener('click', function(){
    var root = document.documentElement;
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('splanly-theme', next); }catch(e){}
    try{ var f = JSON.parse(localStorage.getItem('__FRANKEN__') || '{}'); f.mode = next; localStorage.setItem('__FRANKEN__', JSON.stringify(f)); }catch(e){}
  });
</script>
</body>
</html>
