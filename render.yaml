services:
  - type: web
    name: staffplan
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && gunicorn app.main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          - type: neon
            name: staffplan-db
      - key: SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      - key: SESSION_COOKIE_NAME
        value: staffplan_session
